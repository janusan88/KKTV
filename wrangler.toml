name = "katelyatv"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# 默认 D1 数据库配置（用于命令行操作）
[[d1_databases]]
binding = "DB"
database_name = "katelyatv-db"
database_id = "aba32bf1-643a-4999-acc2-42e5477208ad"

# 顶层全局变量（Pages Functions 运行时读取）
[vars]
NEXT_PUBLIC_STORAGE_TYPE = "d1"
NEXT_PUBLIC_SITE_NAME = "MingTV"
NEXT_PUBLIC_SITE_DESCRIPTION = "小铭影视播放平台"
NEXTAUTH_URL = "https://kktv-2al.pages.dev"
USERNAME = "janus"
AUTH_PASSWORD = "silver81210"
IMAGE_PROXY_ENABLED = "true"
CACHE_TTL = "3600"
CORS_ORIGIN = "*"
RATE_LIMIT_MAX = "100"
RATE_LIMIT_WINDOW = "60000"
HEALTH_CHECK_ENABLED = "true"
HEALTH_CHECK_INTERVAL = "30"
LOG_LEVEL = "info"
LOG_FORMAT = "json"
NODE_ENV = "production"

# 生产环境配置
[env.production]
